[project]
name = "latex-pdf-translator"
version = "0.1.0"
description = "Translate math LaTeX PDFs between any languages while preserving mathematical notation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.27.1",
    "deep-translator>=1.11.0",
    "requests>=2.31",
    "httpx>=0.27",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
apple = [
    "apple-fm-sdk>=0.2; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["translator", "translator.engines"]
py-modules = ["main", "server"]

[tool.setuptools.package-data]
translator = ["fonts/*.otf"]
